<!-- ============ translating.html ============ -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>配分语翻译器 · PEFON</title>
<style>
  :root {
    --ink: #1a1a1a;
    --paper: #fbfaf7;
    --rule: #e6e2d8;
    --gold: #e6a817;
    --gold-soft: #fff8e1;
    --gold-dark: #b8860b;
    --blue: #3a7bd5;
    --blue-soft: #eef4fb;
    --green: #4a9d5f;
    --green-soft: #edf7ee;
    --pink: #d96b8b;
    --pink-soft: #fdeef3;
    --muted: #8a8578;
    --topbar-h: 64px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #ece9e2;
    color: var(--ink);
    font-family: "Noto Serif CJK SC", "Source Han Serif SC", "Songti SC", "SimSun", Georgia, serif;
    line-height: 1.8;
    padding-top: var(--topbar-h);
  }

  /* ============ 顶栏 ============ */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 999;
    height: var(--topbar-h);
    background: rgba(251,250,247,0.96);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--rule);
  }
  .topbar .inner {
    max-width: 1240px; margin: 0 auto;
    height: var(--topbar-h); padding: 0 24px;
    display: flex; align-items: center; gap: 32px;
  }
  .topbar .brand {
    display: flex; align-items: center; gap: 10px;
    text-decoration: none; color: var(--ink);
    font-weight: bold; letter-spacing: 3px; font-size: 19px;
  }
  .topbar .brand span { color: var(--gold); }
  .topbar .brand small {
    font-size: 11px; color: var(--muted);
    letter-spacing: 2px; font-weight: normal; margin-left: 2px;
  }
  .topbar .links { display: flex; gap: 4px; margin-left: auto; }
  .topbar .links a {
    color: var(--ink); text-decoration: none;
    padding: 8px 18px; border-radius: 8px;
    font-size: 15px; transition: all .15s; letter-spacing: 1px;
  }
  .topbar .links a:hover { background: var(--gold-soft); color: var(--gold-dark); }
  .topbar .links a.active { background: var(--gold); color: #fff; }
  .topbar .head-link {
    display: inline-flex; align-items: center;
    margin-left: 4px; text-decoration: none;
    transition: transform .15s;
  }
  .topbar .head-link:hover { transform: scale(1.08); }
  .head-avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: linear-gradient(135deg, #f9d97a, #e6a817);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 20px; font-weight: bold;
    border: 2px solid #fff;
    box-shadow: 0 2px 8px rgba(230,168,23,0.35);
    overflow: hidden;
  }
  .head-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  @media (max-width: 720px) {
    .topbar .inner { padding: 0 14px; gap: 10px; }
    .topbar .brand { font-size: 16px; letter-spacing: 2px; }
    .topbar .brand small { display: none; }
    .topbar .links a { padding: 6px 10px; font-size: 13px; }
    .head-avatar { width: 34px; height: 34px; font-size: 16px; }
  }

  .page {
    max-width: 1000px; margin: 0 auto; padding: 40px 24px 80px;
  }
  .panel {
    background: var(--paper); border-radius: 12px;
    box-shadow: 0 2px 24px rgba(0,0,0,0.08);
    padding: 40px 48px;
  }
  @media (max-width: 720px) { .panel { padding: 24px 20px; } }

  h1 { font-size: 28px; margin: 0 0 6px; letter-spacing: 4px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 32px; }

  .tabs {
    display: flex; gap: 4px; margin-bottom: 20px;
    border-bottom: 1px solid var(--rule);
  }
  .tab {
    padding: 10px 18px; cursor: pointer; font-size: 15px;
    border: none; background: transparent; font-family: inherit;
    color: var(--muted); border-bottom: 2px solid transparent;
    margin-bottom: -1px; transition: all .15s;
  }
  .tab:hover { color: var(--ink); }
  .tab.active { color: var(--gold-dark); border-bottom-color: var(--gold); }

  .io { margin-bottom: 20px; }
  .io label {
    display: block; font-size: 13px; color: var(--muted);
    letter-spacing: 1px; margin-bottom: 8px;
  }
  textarea {
    width: 100%; min-height: 100px; padding: 14px 16px;
    border: 1px solid var(--rule); border-radius: 8px;
    font-size: 18px; font-family: inherit; resize: vertical;
    background: #fff; line-height: 1.7; letter-spacing: 1px;
  }
  textarea:focus { outline: none; border-color: var(--gold); }
  textarea.glyph-output {
    background: #1a1a1a; color: #f5f2ea;
    font-family: "JetBrains Mono", "DejaVu Sans", monospace;
    font-size: 26px; letter-spacing: 12px;
    min-height: 110px; border-color: #1a1a1a;
  }
  textarea.latin-output {
    background: #fff; color: var(--blue);
    font-family: "JetBrains Mono", monospace;
    font-size: 20px; letter-spacing: 2px;
  }

  .btnrow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  button.btn {
    padding: 8px 18px; border: 1px solid var(--rule);
    background: #fff; border-radius: 6px; cursor: pointer;
    font-size: 14px; font-family: inherit; transition: all .15s;
  }
  button.btn:hover { background: var(--gold-soft); border-color: var(--gold); }
  button.btn.primary {
    background: var(--gold); color: #fff; border-color: var(--gold);
  }
  button.btn.primary:hover { opacity: 0.9; background: var(--gold); }

  .breakdown {
    margin-top: 24px; padding: 18px 20px;
    background: #f7f5f0; border-radius: 8px;
    display: none;
  }
  .breakdown.show { display: block; }
  .breakdown h4 {
    margin: 0 0 12px; font-size: 13px; color: var(--muted);
    letter-spacing: 1px; font-weight: normal;
  }
  .syl-list { display: flex; flex-wrap: wrap; gap: 10px; }
  .syl {
    display: inline-flex; flex-direction: column; align-items: center;
    background: #fff; border: 1px solid var(--rule); border-radius: 6px;
    padding: 10px 14px; min-width: 64px;
  }
  .syl .glyph {
    font-family: "JetBrains Mono", "DejaVu Sans", monospace;
    font-size: 24px; line-height: 1; color: #1a1a1a;
  }
  .syl .lat {
    font-family: "JetBrains Mono", monospace;
    font-size: 12px; color: var(--blue); margin-top: 6px;
    letter-spacing: 1px;
  }
  .syl.unknown .glyph { color: #ccc; }

  .note {
    margin-top: 16px; padding: 12px 16px;
    background: var(--gold-soft); border-left: 4px solid var(--gold);
    border-radius: 4px; font-size: 14px;
  }

  .glyph-table {
    width: 100%; border-collapse: collapse; background: #1a1a1a;
    font-family: "JetBrains Mono", "DejaVu Sans", monospace;
    font-size: 18px; color: #f5f2ea; border-radius: 8px;
    overflow: hidden; margin-top: 12px;
  }
  .glyph-table th, .glyph-table td {
    border: 1px solid #333; padding: 10px 6px;
    text-align: center; min-width: 44px;
  }
  .glyph-table th { background: #111; color: var(--gold); font-weight: normal; font-size: 15px; }
  .glyph-table td:first-child { background: #111; color: var(--gold); font-weight: normal; }
  .glyph-table .cell { transition: background .15s; }
  .glyph-table .cell:hover { background: #333; }

  details {
    margin-top: 20px; border: 1px solid var(--rule);
    border-radius: 8px; background: #fff; overflow: hidden;
  }
  details summary {
    padding: 12px 18px; cursor: pointer; font-size: 14px;
    color: #555; user-select: none; list-style: none;
  }
  details summary::-webkit-details-marker { display: none; }
  details summary::before { content: "▸ "; color: var(--muted); }
  details[open] summary::before { content: "▾ "; }
  details[open] summary { border-bottom: 1px solid var(--rule); background: #faf8f2; }
  details .content { padding: 20px; }

  .mode-hint {
    font-size: 13px; color: var(--muted); margin-top: 8px;
  }
  .mode-hint code {
    background: #f0ede6; padding: 1px 6px; border-radius: 3px;
    font-family: "JetBrains Mono", monospace; color: var(--gold-dark);
  }
</style>
</head>
<body>

<!-- ============ 顶栏 ============ -->
<nav class="topbar">
  <div class="inner">
    <a class="brand" href="index.html">
      配<span>分</span>语<small>PEFON</small>
    </a>
    <div class="links">
      <a href="index.html">首页</a>
      <a href="studing.html">学习</a>
      <a href="translating.html" class="active">翻译</a>
      <a href="head.html" class="head-link" title="关于作者">
        <span class="head-avatar">
          <img src="cat.png" alt="Cerasumn">
        </span>
      </a>
    </div>
  </div>
</nav>

<div class="page">
  <div class="panel">
    <h1>象形字翻译器</h1>
    <p class="sub">PEFON 拉丁写法 ⇄ 象形写法 互译工具</p>

    <div class="tabs">
      <button class="tab active" data-mode="toGlyph">拉丁 → 象形</button>
      <button class="tab" data-mode="toLatin">象形 → 拉丁</button>
    </div>

    <div id="paneToGlyph">
      <div class="io">
        <label>输入拉丁写法</label>
        <textarea id="latinInput" placeholder="例如：mi a fo e ni.">mi a fo e ni.</textarea>
        <div class="mode-hint">支持任意句子。按音节自动切分，例如 <code>sanma</code> → <code>san</code> + <code>ma</code>。</div>
      </div>
      <div class="io">
        <label>象形写法</label>
        <textarea id="glyphOutput" class="glyph-output" readonly></textarea>
      </div>
      <div class="btnrow">
        <button class="btn primary" onclick="translateToGlyph()">翻译 →</button>
        <button class="btn" onclick="document.getElementById('latinInput').value='mi a fo e ni.';translateToGlyph()">示例</button>
        <button class="btn" onclick="document.getElementById('latinInput').value='';translateToGlyph()">清空</button>
      </div>
      <div class="breakdown" id="breakdownGlyph">
        <h4>逐音节对照</h4>
        <div class="syl-list" id="sylListGlyph"></div>
      </div>
    </div>

    <div id="paneToLatin" style="display:none;">
      <div class="io">
        <label>输入象形写法</label>
        <textarea id="glyphInput" class="glyph-output" placeholder="粘贴象形字符"></textarea>
        <div class="mode-hint">粘贴象形字符，程序会按字符逐个还原成拉丁音节。</div>
      </div>
      <div class="io">
        <label>拉丁写法</label>
        <textarea id="latinOutput" class="latin-output" readonly></textarea>
      </div>
      <div class="btnrow">
        <button class="btn primary" onclick="translateToLatin()">翻译 →</button>
        <button class="btn" onclick="document.getElementById('glyphInput').value='⌒ I ⊃ || ↓';translateToLatin()">示例</button>
        <button class="btn" onclick="document.getElementById('glyphInput').value='';translateToLatin()">清空</button>
      </div>
      <div class="breakdown" id="breakdownLatin">
        <h4>逐字还原</h4>
        <div class="syl-list" id="sylListLatin"></div>
      </div>
    </div>

    <div class="note">
      <strong>注意：</strong>此工具使用近似的 Unicode 符号来模拟象形字，不是官方字体。真正的象形字形请参考 FEFENPEFON 字体。
    </div>

    <details>
      <summary>查看完整象形字对照表</summary>
      <div class="content">
        <div style="overflow-x:auto;">
          <table class="glyph-table" id="glyphTable"></table>
        </div>
        <p class="mode-hint" style="margin-top:16px;">
          横轴为辅音，纵轴为元音。<code>ø</code> 列表示无辅音（纯元音音节）。
        </p>
      </div>
    </details>
  </div>
</div>

<script>
const GLYPH_TABLE = {
  a: { p:'⌒', t:'∧', k:'⌐', f:'⌣', s:'⫽', h:'○', m:'Ω', n:'∞', l:'⊥', w:'I', y:'⊖', 'ø':'|' },
  e: { p:'⌣', t:'V', k:'⌐', f:'+', s:'Y', h:'♄', m:'#', n:'✕', l:'⨥', w:'II', y:'◇', 'ø':'||' },
  i: { p:'>', t:'✠', k:'§', f:'O', s:'+', h:'⊥', m:'T', n:'↓', l:'⌐', w:'≠', y:'⋉', 'ø':'⊃' },
  o: { p:'=', t:'⊤', k:'≈', f:'⊃', s:'Ɔ', h:'♡', m:'⊓', n:'⊙', l:'L', w:'ω', y:'⊣', 'ø':'⊢' },
  u: { p:'<', t:'⊕', k:'□', f:'ε', s:'3', h:'#', m:'⌒', n:'⊕', l:'⌐', w:'C', y:'⌐', 'ø':'⊣' },
};

const GLYPH_TO_SYL = {};
for (const v of Object.keys(GLYPH_TABLE)) {
  for (const c of Object.keys(GLYPH_TABLE[v])) {
    const glyph = GLYPH_TABLE[v][c];
    const syl = c === 'ø' ? v : c + v;
    if (!GLYPH_TO_SYL[glyph]) GLYPH_TO_SYL[glyph] = syl;
  }
}

const CONSONANTS = 'ptkfshmnlwy';
const VOWELS = 'aeiou';

function splitSyllables(text) {
  const result = [];
  let i = 0;
  while (i < text.length) {
    const ch = text[i];
    if (!CONSONANTS.includes(ch) && !VOWELS.includes(ch)) {
      result.push({ type: 'raw', val: ch });
      i++;
      continue;
    }
    if (ch === 'n' && (i + 1 >= text.length || !VOWELS.includes(text[i + 1]))) {
      result.push({ type: 'n-participle', val: 'n' });
      i++;
      continue;
    }
    let syl = '';
    if (CONSONANTS.includes(ch)) {
      syl += ch; i++;
      if (i < text.length && VOWELS.includes(text[i])) {
        syl += text[i]; i++;
        if (text[i] === 'n') {
          if (i + 1 >= text.length || !VOWELS.includes(text[i + 1])) {
            syl += 'n'; i++;
          }
        }
      }
    } else if (VOWELS.includes(ch)) {
      syl += ch; i++;
      if (text[i] === 'n') {
        if (i + 1 >= text.length || !VOWELS.includes(text[i + 1])) {
          syl += 'n'; i++;
        }
      }
    }
    if (syl) result.push({ type: 'syl', val: syl });
  }
  return result;
}

function sylToGlyph(syl) {
  if (syl.endsWith('n') && syl.length >= 2) {
    const base = syl.slice(0, -1);
    const baseGlyph = sylToGlyphNoN(base);
    if (baseGlyph) return baseGlyph + '\u0332';
    return null;
  }
  return sylToGlyphNoN(syl);
}

function sylToGlyphNoN(syl) {
  if (syl.length === 1 && VOWELS.includes(syl)) return GLYPH_TABLE[syl]['ø'];
  if (syl.length >= 2) {
    const c = syl[0], v = syl[1];
    if (GLYPH_TABLE[v] && GLYPH_TABLE[v][c]) return GLYPH_TABLE[v][c];
  }
  return null;
}

function translateToGlyph() {
  const text = document.getElementById('latinInput').value;
  const tokens = splitSyllables(text);
  const sylList = document.getElementById('sylListGlyph');
  sylList.innerHTML = '';
  let output = '';
  tokens.forEach(tk => {
    if (tk.type === 'raw') { output += tk.val; return; }
    if (tk.type === 'n-participle') { output += 'n'; return; }
    const glyph = sylToGlyph(tk.val);
    output += glyph || '□';
    const div = document.createElement('div');
    div.className = 'syl' + (glyph ? '' : ' unknown');
    div.innerHTML = `<span class="glyph">${glyph || '?'}</span><span class="lat">${tk.val}</span>`;
    sylList.appendChild(div);
  });
  document.getElementById('glyphOutput').value = output;
  document.getElementById('breakdownGlyph').classList.add('show');
}

function translateToLatin() {
  const text = document.getElementById('glyphInput').value;
  const sylList = document.getElementById('sylListLatin');
  sylList.innerHTML = '';
  let output = '';
  let buffer = '';
  let bufferSyl = null;
  const flush = () => {
    if (bufferSyl) {
      output += bufferSyl;
      const div = document.createElement('div');
      div.className = 'syl';
      div.innerHTML = `<span class="glyph">${buffer}</span><span class="lat">${bufferSyl}</span>`;
      sylList.appendChild(div);
      buffer = ''; bufferSyl = null;
    }
  };
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (ch === '\u0332') {
      if (bufferSyl) { bufferSyl += 'n'; buffer += ch; }
      continue;
    }
    if (ch === ' ' || ch === '\n' || ch === '\t' ||
        '.,!?;:()[]"\'/\\-'.includes(ch)) {
      flush();
      output += ch;
      continue;
    }
    const cand = buffer + ch;
    if (GLYPH_TO_SYL[cand]) {
      buffer = cand; bufferSyl = GLYPH_TO_SYL[cand];
    } else if (GLYPH_TO_SYL[ch]) {
      flush();
      buffer = ch; bufferSyl = GLYPH_TO_SYL[ch];
    } else {
      flush();
      output += ch;
    }
  }
  flush();
  document.getElementById('latinOutput').value = output;
  document.getElementById('breakdownLatin').classList.add('show');
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    const mode = tab.dataset.mode;
    document.getElementById('paneToGlyph').style.display = mode === 'toGlyph' ? '' : 'none';
    document.getElementById('paneToLatin').style.display = mode === 'toLatin' ? '' : 'none';
  };
});

(function renderGlyphTable() {
  const el = document.getElementById('glyphTable');
  const consOrder = ['p','t','k','f','s','h','m','n','l','w','y','ø'];
  const vowelOrder = ['a','e','i','o','u'];
  let thead = '<tr><th>ø</th>';
  consOrder.forEach(c => thead += `<th>${c}</th>`);
  thead += '</tr>';
  let tbody = '';
  vowelOrder.forEach(v => {
    tbody += `<tr><td>${v}</td>`;
    consOrder.forEach(c => {
      const g = GLYPH_TABLE[v][c];
      const syl = c === 'ø' ? v : c + v;
      tbody += `<td class="cell" title="${syl}"><span class="glyph">${g}</span></td>`;
    });
    tbody += '</tr>';
  });
  el.innerHTML = thead + tbody;
})();

translateToGlyph();
</script>
</body>
</html>
